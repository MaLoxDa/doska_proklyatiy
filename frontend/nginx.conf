# nginx РґР»СЏ СЃС‚Р°С‚РёРєРё С„СЂРѕРЅС‚РµРЅРґР°. РџСЂРѕС†РµСЃСЃ СЂР°Р±РѕС‚Р°РµС‚ РѕС‚ РЅРµРїСЂРёРІРёР»РµРіРёСЂРѕРІР°РЅРЅРѕРіРѕ
# РїРѕР»СЊР·РѕРІР°С‚РµР»СЏ nginx, РїРѕСЌС‚РѕРјСѓ pid Рё РІСЂРµРјРµРЅРЅС‹Рµ С„Р°Р№Р»С‹ РІС‹РЅРµСЃРµРЅС‹ РІ /tmp.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # РџРѕРЅСЏС‚РЅС‹Рµ URL: /uslugi -> uslugi.html, /uslugi/zashchitnye-obryady -> uslugi/zashchitnye-obryady.html
        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        location ~* \.(?:css|js|woff2|jpg|jpeg|png|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # API РїСЂРѕРєСЃРёСЂСѓРµС‚СЃСЏ РІРЅРµС€РЅРёРј nginx, СЃСЋРґР° Р·Р°РїСЂРѕСЃС‹ РЅРµ РїРѕРїР°РґР°СЋС‚
        location /api/ {
            return 404;
        }
    }
}

