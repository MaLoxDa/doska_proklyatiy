server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Понятные URL: /uslugi -> uslugi.html, /uslugi/zashchitnye-obryady -> uslugi/zashchitnye-obryady.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~* \.(?:css|js|woff2|jpg|jpeg|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # API проксируется внешним nginx, сюда запросы не попадают
    location /api/ {
        return 404;
    }
}
