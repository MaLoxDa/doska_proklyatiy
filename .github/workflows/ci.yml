name: Сборка Docker-образа

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v4

      - name: Настроить Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Собрать Docker-образ
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: doska-proklyatiy:latest

      - name: Вход в GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация образа в GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/maloxda/doska-proklyatiy:latest
            ghcr.io/maloxda/doska-proklyatiy:${{ github.sha }}