worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/xml+rss;

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name doska.localhost www.doska.localhost localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: Р ВµР Т‘Р С‘Р Р…Р В°РЎРЏ РЎвЂљР С•РЎвЂЎР С”Р В° Р Р†РЎвЂ¦Р С•Р Т‘Р В°
    server {
        listen 443 ssl;
        http2 on;
        server_name doska.localhost;

        ssl_certificate     /etc/nginx/certs/doska.localhost.pem;
        ssl_certificate_key /etc/nginx/certs/doska.localhost-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Р РЋРЎвЂљР В°РЎвЂљР С‘Р С”Р В° РЎвЂћРЎР‚Р С•Р Р…РЎвЂљР ВµР Р…Р Т‘Р В°: РЎРѓР ВµРЎР‚Р Р†Р С‘РЎРѓ frontend (nginx РЎРѓ РЎРѓР С•Р В±РЎР‚Р В°Р Р…Р Р…РЎвЂ№Р С `next export`)
        location /_next/static/ {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            proxy_pass http://frontend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # API: Р В·Р В°Р С”РЎР‚РЎвЂ№РЎвЂљР С• Р С•РЎвЂљ Р С‘Р Р…Р Т‘Р ВµР С”РЎРѓР В°РЎвЂ Р С‘Р С‘ Р В·Р В°Р С–Р С•Р В»Р С•Р Р†Р С”Р С•Р С X-Robots-Tag
        location /api/ {
            proxy_hide_header X-Robots-Tag;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Cache-Control "no-store" always;
        }

        # robots.txt Р С‘ sitemap.xml РІР‚вЂќ 200 Р С‘ Р С”Р С•РЎР‚РЎР‚Р ВµР С”РЎвЂљР Р…РЎвЂ№Р в„– РЎвЂљР С‘Р С—
        location = /robots.txt {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=3600" always;
        }

        location = /sitemap.xml {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=3600" always;
        }
    }
}

