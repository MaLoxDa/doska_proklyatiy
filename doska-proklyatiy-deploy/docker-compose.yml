name: doska-proklyatiy

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://doska.localhost}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    image: ghcr.io/maloxda/doska-proklyatiy-frontend:${TAG:-local}
    container_name: doska-frontend
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - doska-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ghcr.io/maloxda/doska-proklyatiy-backend:${TAG:-local}
    container_name: doska-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
    env_file:
      - ../.env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      frontend:
        condition: service_started
    networks:
      - doska-net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: ghcr.io/maloxda/doska-proklyatiy-nginx:${TAG:-local}
    container_name: doska-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    # В настоящем деплое конфиг и сертификаты монтируются томами:
    # volumes:
    #   - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    #   - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - doska-net

networks:
  doska-net:
    driver: bridge

